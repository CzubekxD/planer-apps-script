// 12. TESTY — uruchom dopisując ?test do adresu (planer.html?test). Nic nie zapisują.
const TESTS = [];
const test = (name, fn) => TESTS.push({ name, fn });
const eq = (got, exp) => { if (JSON.stringify(got) !== JSON.stringify(exp)) throw new Error(`jest ${JSON.stringify(got)}, oczekiwano ${JSON.stringify(exp)}`); };
const D = (y, m, d) => new Date(y, m - 1, d);
const L = DATE_LIB;

// --- daty ---
test('zapis i odczyt daty wraca do tej samej daty', () => eq(L.toISO(L.fromISO('2026-11-04')), '2026-11-04'));
test('nieistniejąca data (30 lutego) jest odrzucana, a nie zamieniana na 2 marca', () => eq(L.fromISO('2026-02-30'), null));
test('zły format daty jest odrzucany', () => { eq(L.fromISO('04.11.2026'), null); eq(L.fromISO(''), null); });
test('koniec wyłączny: projekt do 24.12 ma end = 25.12', () => eq(L.toISO(L.addDays(D(2026, 12, 24), 1)), '2026-12-25'));
test('marzec ma 30 dni różnicy mimo zmiany czasu (doba 23 h)', () => eq(L.diffDays(D(2027, 3, 1), D(2027, 3, 31)), 30));
test('październik: 30 dni mimo zmiany czasu (doba 25 h)', () => eq(L.diffDays(D(2026, 10, 1), D(2026, 10, 31)), 30));
test('dodanie 1 dnia w noc zmiany czasu zostaje o północy', () => { const d = L.addDays(D(2027, 3, 27), 1); eq([d.getDate(), d.getHours()], [28, 0]); });
test('tydzień ISO: 4.11.2026 = T45', () => eq(L.isoWeek(D(2026, 11, 4)), 45));
test('tydzień ISO: 1.01.2027 = T53 (roku 2026)', () => eq(L.isoWeek(D(2027, 1, 1)), 53));
test('tydzień ISO: 30.12.2024 = T1 (roku 2025)', () => eq(L.isoWeek(D(2024, 12, 30)), 1));
test('tydzień ISO: 4.01.2027 = T1', () => eq(L.isoWeek(D(2027, 1, 4)), 1));

// --- oś ---
const AX = {
  day:   { origin: D(2026, 11, 1), pxPerDay: 36, monthWidth: 120 },
  week:  { origin: D(2026, 11, 1), pxPerDay: 20, monthWidth: 120 },
  month: { origin: D(2026, 11, 1), pxPerDay: null, monthWidth: 120 }
};
test('początek osi = 0 px we wszystkich skalach', () => Object.values(AX).forEach(a => eq(L.toPx(a.origin, a), 0)));
test('dni: 4.11 = 3 × 36 px', () => eq(L.toPx(D(2026, 11, 4), AX.day), 108));
test('tygodnie: tydzień = 140 px', () => eq(L.toPx(D(2026, 11, 8), AX.week) - L.toPx(D(2026, 11, 1), AX.week), 140));
test('miesiące: każdy miesiąc ma 120 px (luty też)', () => { eq(L.toPx(D(2027, 3, 1), AX.month) - L.toPx(D(2027, 2, 1), AX.month), 120); eq(L.toPx(D(2027, 11, 1), AX.month), 12 * 120); });
test('każdy dzień przez 2 lata: data → piksel → ta sama data (wszystkie skale)', () => {
  Object.entries(AX).forEach(([k, a]) => {
    for (let d = new Date(a.origin), i = 0; i < 730; i++, d = L.addDays(d, 1)) {
      const back = L.fromPx(L.toPx(d, a), a);
      if (L.toISO(back) !== L.toISO(d)) throw new Error(`${k}: ${L.toISO(d)} wraca jako ${L.toISO(back)}`);
    }
  });
});
test('oś od wybranego dnia (18.11): ten dzień = 0 px we wszystkich skalach', () => Object.values(AX).forEach(a => eq(L.toPx(D(2026, 11, 18), { ...a, origin: D(2026, 11, 18) }), 0)));
test('oś od 18.11: każdy dzień przez 2 lata wraca do tej samej daty (wszystkie skale)', () => {
  Object.entries(AX).forEach(([k, a0]) => { const a = { ...a0, origin: D(2026, 11, 18) };
    for (let d = new Date(a.origin), i = 0; i < 730; i++, d = L.addDays(d, 1)) { const back = L.fromPx(L.toPx(d, a), a); if (L.toISO(back) !== L.toISO(d)) throw new Error(`${k}: ${L.toISO(d)} wraca jako ${L.toISO(back)}`); } });
});
test('oś od 18.11, miesiące: grudzień nadal ma 120 px', () => { const a = { ...AX.month, origin: D(2026, 11, 18) }; eq(L.toPx(D(2027, 1, 1), a) - L.toPx(D(2026, 12, 1), a), 120); });
test('oś rośnie: późniejszy dzień nigdy nie ma mniejszego piksela', () => {
  Object.entries(AX).forEach(([k, a]) => {
    let prev = -1;
    for (let d = new Date(a.origin), i = 0; i < 730; i++, d = L.addDays(d, 1)) { const x = L.toPx(d, a); if (x <= prev) throw new Error(`${k}: ${L.toISO(d)}`); prev = x; }
  });
});

};

// Testy idą w tle. Okno pokazuje się WYŁĄCZNIE przy NOK i wymienia tylko testy, które nie przeszły.
// Przy wszystkich OK nic się nie pojawia — wynik jest tylko w konsoli przeglądarki (F12).
function runTests() {
  const res = TESTS.map(t => { try { t.fn(); return { name: t.name, ok: true }; } catch (e) { return { name: t.name, ok: false, msg: e.message }; } });
  const bad = res.filter(r => !r.ok);
  console.info(`Testy planera: ${res.length - bad.length} z ${res.length} OK`);
  if (!bad.length) return res;
  console.warn('Testy planera — NOK:', bad);
  const bar = document.createElement('div');
  bar.id = 'testyNok';
  bar.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:3000;max-height:40vh;overflow:auto;border-radius:12px;padding:12px 16px;font:13px/1.5 system-ui;box-shadow:var(--cien);background:var(--blad-tlo);color:var(--blad);border:1px solid currentColor';
  bar.innerHTML = `<b>Testy NOK: ${bad.length} z ${res.length}</b> — przyślij ten komunikat <button style="float:right" onclick="this.parentNode.remove()">✕</button>` +
    `<ul style="margin:6px 0 0 18px">${bad.map(r => `<li>✗ ${esc(r.name)} — <b>${esc(r.msg)}</b></li>`).join('')}</ul>`;
  document.body.appendChild(bar);
  return res;
}

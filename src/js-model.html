// ===== DATE_LIB — czysta logika dat i osi (nic nie rysuje, nie dotyka AppState; testy: ?test) =====
// Umowa: daty to lokalna północ; koniec projektu jest WYŁĄCZNY (projekt do 24.12 ma end = 25.12).
const DATE_LIB = (() => {
  const toISO = (date) => {
    if (!date || isNaN(date.getTime())) return null;
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
  };
  const fromISO = (s) => {
    if (!s || typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    const [y, m, d] = s.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    // odrzuć daty nieistniejące (np. 2026-02-30 nie może stać się po cichu 2 marca)
    return (date.getFullYear() === y && date.getMonth() === m - 1 && date.getDate() === d) ? date : null;
  };
  const monthsDiff = (d1, d2) => (d2.getFullYear() - d1.getFullYear()) * 12 + (d2.getMonth() - d1.getMonth());
  const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
  const addDays = (date, days) => { const d = new Date(date); d.setDate(d.getDate() + days); return d; };
  // Liczy dni kalendarzowe, odporne na zmianę czasu (doba 23/25 h)
  const diffDays = (d1, d2) => Math.round((Date.UTC(d2.getFullYear(), d2.getMonth(), d2.getDate()) - Date.UTC(d1.getFullYear(), d1.getMonth(), d1.getDate())) / 86400000);
  const format = (date) => date ? `${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth() + 1).padStart(2, '0')}.${date.getFullYear()}` : '—';
  const isoWeek = (date) => {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 3);          // czwartek tego tygodnia
    const jan4 = new Date(d.getFullYear(), 0, 4);
    return 1 + Math.round((diffDays(jan4, d) - 3 + ((jan4.getDay() + 6) % 7)) / 7);
  };
  // Oś: axis = { origin (dowolny dzień), pxPerDay (dni/tygodnie) albo null (miesiące), monthWidth }
  // Miesiące mają równą szerokość, liczoną od 1. dnia miesiąca startu; origin środkiem miesiąca przesuwa oś o tę część.
  const monthRaw = (date, base, mw) => (monthsDiff(base, date) + (date.getDate() - 1) / daysInMonth(date.getFullYear(), date.getMonth())) * mw;
  const monthBase = origin => new Date(origin.getFullYear(), origin.getMonth(), 1);
  const toPx = (date, axis) => {
    if (!date) return 0;
    if (axis.pxPerDay) return diffDays(axis.origin, date) * axis.pxPerDay;
    const base = monthBase(axis.origin);
    return Math.round(monthRaw(date, base, axis.monthWidth) - monthRaw(axis.origin, base, axis.monthWidth));
  };
  const fromPx = (px, axis) => {
    if (axis.pxPerDay) return addDays(axis.origin, Math.round(px / axis.pxPerDay));
    const base = monthBase(axis.origin);
    px += monthRaw(axis.origin, base, axis.monthWidth);
    const mDiff = Math.floor(px / axis.monthWidth);
    const rem = px - mDiff * axis.monthWidth;
    const target = new Date(base.getFullYear(), base.getMonth() + mDiff, 1);
    const dm = daysInMonth(target.getFullYear(), target.getMonth());
    target.setDate(Math.max(1, Math.min(dm, Math.round((rem / axis.monthWidth) * dm) + 1)));
    return target;
  };
  return { toISO, fromISO, monthsDiff, daysInMonth, addDays, diffDays, format, isoWeek, toPx, fromPx, monthBase };
})();

const toLocalISO = DATE_LIB.toISO;
const fromLocalISO = DATE_LIB.fromISO;
const getMonthsDiff = DATE_LIB.monthsDiff;
const daysInMonth = DATE_LIB.daysInMonth;

const diffDays = DATE_LIB.diffDays;

// TERMIN [start, end): w danych koniec jest WYŁĄCZNY (dzień po ostatnim dniu), a na ekranie i w doneAt — ostatni dzień.
// Tylko TERM zamienia jedno na drugie; reszta kodu nie dodaje ani nie odejmuje „1 dnia” przy końcu (pilnuje test w server.test.js).
const TERM = {
  lastDay: end => end ? addDays(end, -1) : null,                 // koniec wyłączny → ostatni dzień
  endAfter: lastDay => lastDay ? addDays(lastDay, 1) : null,     // ostatni dzień → koniec wyłączny
  days: (start, end) => diffDays(start, end),                    // długość w dniach (z ostatnim dniem)
  label: (start, end) => `${formatDate(start)} – ${formatDate(TERM.lastDay(end))}`,
  endFrom: (start, days) => addDays(start, days),                // koniec terminu o danej długości
  contains: (start, end, day) => start <= day && day < end,
  overlaps: (start, end, from, to) => start < to && end > from
};

const SCALES = {
  day:   { pxPerDay: 36, drawDays: 5 },
  week:  { pxPerDay: 20, drawDays: 14 },
  month: { pxPerDay: null, drawDays: null }
};
const pxPerDay = () => SCALES[AppState.scale].pxPerDay;
const axisNow = () => ({ origin: AppState.globalStartDate, pxPerDay: pxPerDay(), monthWidth: AppState.monthWidth });
const dateToPx = (date) => DATE_LIB.toPx(date, axisNow());
const pxToDate = (px) => DATE_LIB.fromPx(px, axisNow());

// Opóźnienie wobec planu pierwotnego (planowany go nie ma); zakończony liczy się od faktycznej daty zakończenia (koniec w danych jest wyłączny)
const actualEnd = p => (p.status === 'done' && p.doneAt) ? TERM.endAfter(p.doneAt) : p.end;
const delayDays = p => (p.status !== 'planned' && p.baselineEnd && actualEnd(p)) ? diffDays(p.baselineEnd, actualEnd(p)) : 0;
const viewEnd = () => new Date(AppState.globalStartDate.getFullYear(), AppState.globalStartDate.getMonth() + AppState.horizonMonths, 1);
const trackWidth = () => dateToPx(viewEnd());
// Domyślna szerokość klocka po pojedynczym kliknięciu (bez przeciągania)
const defaultDrawPx = () => pxPerDay() ? SCALES[AppState.scale].drawDays * pxPerDay() : AppState.monthWidth;
const hasDates = p => p.start && p.end;

  .map(x => String(x).trim().toLowerCase()).filter(x => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)))];
// Perm = kim jestem i co mogę, osobno od trybu. Trzy niezależne rzeczy:
//  • rola z Arkusza: właściciel / edytor karty / obserwator (CONTEXT.md),
//  • tryb „Podgląd jako” (właściciel widzi planer oczami innej osoby; nic się nie zapisuje),
//  • brak Arkusza (edycja zablokowana dla wszystkich).
// Reszta kodu pyta tylko: role(), canManage() (cały plan), canEditCard(p), canEditAny().
const createPerm = cards => {   // cards() → wszystkie karty planu (do rozpoznania edytora)
  const st = { user: '', owner: false, preview: '', offline: false };
  const lower = v => String(v || '').toLowerCase();
  const self = {
    identify(user, isOwner) { st.user = lower(user); st.owner = !!isOwner; st.offline = false; },
    goOffline() { st.user = ''; st.owner = false; st.preview = ''; st.offline = true; },
    previewAs(email) { st.preview = st.owner && !st.offline ? lower(email) : ''; },   // tylko prawdziwy właściciel
    get user() { return st.preview || st.user; },            // czyje oczy: podgląd albo ja
    get realOwner() { return st.owner && !st.offline; },     // prawdziwy właściciel (niezależnie od podglądu)
    get previewing() { return !!st.preview; },
    get offline() { return st.offline; },
    canManage() { return self.realOwner && !st.preview; },   // „może teraz zmieniać cały plan”
    canEditCard(p) { return self.canManage() || (!st.offline && !!self.user && !!p && (p.editors || []).includes(self.user)); },
    canEditAny() { return self.canManage() || (!st.offline && cards().some(p => self.canEditCard(p))); },
    role() { return self.canManage() ? 'owner' : self.canEditAny() ? 'editor' : 'observer'; }
  };
  return self;
};
const projectsOf = t => t.id === AppState.activeTab ? AppState.projects : t.projects;

// 3. OSOBY I ROLE
const teamOf = p => p.assignments.filter(a => a.group === 'team');
const stakeOf = p => p.assignments.filter(a => a.group === 'stakeholders');

function normAssign(a) {
  if (!a || typeof a !== 'object') return null;
  const person = cleanName(a.person);
  if (!person) return null;
  return { group: GROUPS.includes(a.group) ? a.group : 'team', role: cleanName(a.role) || 'Bez roli', person };
}

// Jednorazowa migracja starych pól (Kupiec/kategoria, PO, SM, Zespół, Sponsor, Interesariusze)
function splitPeople(text, defRole) {
  return String(text || '').split(/[,;\n]+/).map(s => s.trim()).filter(Boolean).map(s => {
    const m = s.match(/^([^:]{1,25}):\s*(.+)$/);
    return m ? { role: cleanName(m[1]), person: cleanName(m[2]) } : { role: defRole, person: cleanName(s) };
  }).filter(a => a.person.length > 1);
}
function migrate(p) {
  const out = [];
  const add = (group, list) => list.forEach(a => out.push({ group, ...a }));
  if (p.team) add('team', [{ role: 'Kupiec', person: cleanName(p.team) }]);
  add('team', splitPeople(p.po, 'PO'));
  add('team', splitPeople(p.sm, 'Scrum Master'));
  add('team', splitPeople(p.members, 'Zespół'));
  add('stakeholders', splitPeople(p.sponsor, 'Sponsor'));
  add('stakeholders', splitPeople(typeof p.stakeholders === 'string' ? p.stakeholders : '', 'Interesariusz'));
  return out;
}

function allRoles() {
  const m = new Map();
  AppState.projects.forEach(p => {
    const seen = new Set();
    p.assignments.forEach(a => {
      const k = norm(a.role);
      if (!m.has(k)) m.set(k, { name: a.role, count: 0, group: a.group });
      if (!seen.has(k) && !isNA(a.person)) { seen.add(k); m.get(k).count++; }
    });
  });
  return [...m.values()].sort((a, b) => a.name.localeCompare(b.name, 'pl'));
}
function allPersons() {
  const m = new Map();
  syncTab();
  AppState.tabs.forEach(t => t.projects.forEach(p => p.assignments.forEach(a => { const k = norm(a.person); if (!m.has(k) && !isNA(a.person)) m.set(k, a.person); })));
  return [...m.values()].sort((a, b) => a.localeCompare(b, 'pl'));
}
const roleGroup = role => {
  const r = allRoles().find(x => norm(x.name) === norm(role));
  return r ? r.group : 'team';
};

// Osoba w roli (pierwsza, bez „nie dotyczy”) — do koloru w widoku „Wszystko”

// Pasy osi. Widok roli: osoba = pas; „nieprzypisane” tylko gdy coś w nim jest; „nie dotyczy” liczone osobno (lanes.na).
// Widok „Wszystko”: wiersz na projekt (po dacie startu) + pusty wiersz do rysowania nowego.
function buildLanes() {
  if (AppState.viewRole === ALL_VIEW) {
    const items = AppState.projects.filter(p => inView(p) && (AppState.showDone || p.status !== 'done'))
      .sort((a, b) => a.start - b.start || a.end - b.end);
    const out = items.map(p => ({ name: p.title, key: p.id, items: [p], color: personInRole(p, COLOR_ROLE), project: true }));
    out.push({ name: '+ nowy projekt (narysuj tutaj)', key: '', items: [], unassigned: true, color: '' });
    out.na = 0;
    return out;
  }
  const roleKey = norm(AppState.viewRole);
  const lanes = new Map();
  const unassigned = { name: UNASSIGNED, key: '', items: [], unassigned: true };
  let na = 0;
  AppState.projects.filter(inView).forEach(p => {
    const persons = new Map();
    let naHere = false;
    if (roleKey) p.assignments.forEach(a => {
      if (norm(a.role) !== roleKey) return;
      if (isNA(a.person)) { naHere = true; return; }
      if (!persons.has(norm(a.person))) persons.set(norm(a.person), a.person);
    });
    if (!persons.size) { if (naHere) na++; else unassigned.items.push(p); return; }
    persons.forEach((name, k) => {
      if (!lanes.has(k)) lanes.set(k, { name, key: k, items: [], color: name });
      lanes.get(k).items.push(p);
    });
  });
  const out = [...lanes.values()].sort((a, b) => a.name.localeCompare(b.name, 'pl'));
  if (unassigned.items.length || !out.length) out.push(unassigned);   // pusty = ukryty (chyba że nie ma żadnego pasa)
  out.na = na;
  return out;
}
// Układ wierszy w pasie. Projekt z rowHint (ustawionym przeciągnięciem) idzie do swojego wiersza albo najbliższego wolnego niżej;
// reszta wypełnia od góry. Puste wiersze są ściągane, więc rowHint działa jak „kolejność”, a nie sztywny numer.
// winner = id klocka, który wygrywa swój wiersz przy remisie (ostatnio upuszczony).
let lastDropped = null;   // ostatnio upuszczony klocek (render przekazuje go do stack jako winner)
function stack(items, winner = null) {
  const hinted = items.filter(p => Number.isInteger(p.rowHint))
    .sort((a, b) => (b.id === winner) - (a.id === winner) || a.rowHint - b.rowHint || a.start - b.start);
  const rest = items.filter(p => !Number.isInteger(p.rowHint)).sort((a, b) => a.start - b.start || a.end - b.end);
  const rows = [], raw = new Map();
  const fits = (r, p) => !(rows[r] || []).some(q => q.start < p.end && p.start < q.end);
  const place = (p, from) => { let r = Math.max(0, from); while (!fits(r, p)) r++; (rows[r] ||= []).push(p); raw.set(p.id, r); };
  hinted.forEach(p => place(p, p.rowHint));
  rest.forEach(p => place(p, 0));
  const used = [...new Set(raw.values())].sort((x, y) => x - y);
  const pos = new Map([...raw].map(([id, r]) => [id, used.indexOf(r)]));
  return { pos, rows: Math.max(1, used.length) };
}
// Przeniesienie klocka do pasa innej osoby = zmiana osoby w oglądanej roli (pusty toPerson = „nieprzypisane”)
function moveToLane(p, role, fromPerson, toPerson) {
  const rk = norm(role);
  if (!rk || norm(fromPerson) === norm(toPerson)) return false;
  const rest = p.assignments.filter(a => !(norm(a.role) === rk && norm(a.person) === norm(fromPerson) && fromPerson));
  if (toPerson && !rest.some(a => norm(a.role) === rk && norm(a.person) === norm(toPerson))) rest.push({ group: roleGroup(role), role, person: toPerson });
  p.assignments = rest;
  return true;
}
// PRZESUNIĘCIE KAFLA — jedno źródło dla podglądu „tu wyląduje” i dla upuszczenia (podgląd = wynik).
// m = { project, start (nowy start), laneItems (projekty pasa docelowego, jak w renderze), winner (obecny lastDropped),
//       role, fromPerson, toPerson, otherLane (czy pas docelowy to inny pas), srcRow, row (null = bez ruchu w pionie) }
// → { changes (pola projektu do nadpisania; {} = nic), row (wiersz po upuszczeniu), pushed (tytuły zepchniętych niżej), winner }
function planMove(m) {
  const p = m.project, changes = {};
  const start = m.start, end = TERM.endFrom(start, TERM.days(p.start, p.end));
  if (+start !== +p.start) { changes.start = start; changes.end = end; }
  if (m.row != null) {
    const tmp = { assignments: p.assignments.map(a => ({ ...a })) };
    const laneChanged = !!m.otherLane && moveToLane(tmp, m.role, m.fromPerson, m.toPerson);
    if (laneChanged) changes.assignments = tmp.assignments;
    if (laneChanged || m.row !== m.srcRow) changes.rowHint = m.row;
  }
  const winner = 'rowHint' in changes ? p.id : m.winner;
  const others = (m.laneItems || []).filter(x => x.id !== p.id);
  const after = stack(others.concat([{ ...p, ...changes }]), winner);
  const before = stack(m.laneItems || [], m.winner);
  const pushed = others.filter(x => before.pos.has(x.id) && after.pos.get(x.id) > before.pos.get(x.id)).map(x => x.title);
  return { changes, row: after.pos.get(p.id), pushed, winner };
}
// Upuszczenie: nadpisuje pola projektu i ustawia zwycięzcę wiersza. true = coś się zmieniło.
function applyMove(p, plan) {
  if (!Object.keys(plan.changes).length) return false;
  Object.assign(p, plan.changes);
  lastDropped = plan.winner;
  return true;
}
// Kafla zakończonego projektu nie przesuwamy ani nie rozciągamy — daty zmienia się na karcie.

function normProject(p) {
  const status = ['ongoing', 'done'].includes(p.status) ? p.status : 'planned';
  const start = fromLocalISO(p.start), end = fromLocalISO(p.end);
  const mf = (p.mf && typeof p.mf === 'object') ? { ...p.mf } : {};
  if (p.sprint && !mf.sprint) mf.sprint = p.sprint;
  if (p.dod && !mf.dod) mf.dod = p.dod;
  return lifecycleInvariants({
    id: p.id || AppState.generateId(),
    title: p.title || 'Bez tytułu',
    ...Object.fromEntries(META_KEYS.map(k => [k, p[k] || ''])),

    notes: p.notes || '',
    editors: parseEmails(p.editors),
    rowHint: Number.isInteger(p.rowHint) ? p.rowHint : null,
    status,

    milestones: (Array.isArray(p.milestones) ? p.milestones : []).map(m => ({ name: cleanName(m && m.name) || 'Kamień milowy', date: fromLocalISO(m && m.date), done: !!(m && m.done), doneAt: fromLocalISO(m && m.doneAt) })).filter(m => m.date).sort((a, b) => a.date - b.date),
    method: METHODS[p.method] ? p.method : ((mf.sprint || mf.dod) ? 'scrum' : 'klasyczna'),
    mf,
    startedAt: fromLocalISO(p.startedAt),
    doneAt: fromLocalISO(p.doneAt),
    history: Array.isArray(p.history) ? p.history.filter(h => h && h.date && h.status) : [],

}
// CYKL ŻYCIA PROJEKTU (CONTEXT.md: Planowany, Zobowiązanie, Plan pierwotny, Zakończony).
// Zapis karty: z poprzedniego projektu (albo null = nowy) i danych z karty powstaje NOWY projekt. Poprzedni zostaje nietknięty,
// więc Anuluj na karcie niczego nie zmienia. Jedyne miejsce z regułami zmiany statusu:
//  • każda zmiana statusu = wpis w historii statusów (data = dziś),
//  • → w trakcie: zobowiązanie = dziś (chyba że już było); → zakończony: data zakończenia = dziś,
//    a planowany → zakończony bez zobowiązania bierze za zobowiązanie datę startu z karty,
//  • plan pierwotny zamraża się przy zobowiązaniu (obecne daty z karty) i znika przy powrocie do planowanego,
//  • rebaseline (przycisk „Nowy plan pierwotny”): plan pierwotny = obecne daty z karty; dla planowanego bez skutku.
// Niezmienniki projektu (przy wczytaniu i po każdym zapisie karty): planowany nie ma zobowiązania, daty zakończenia ani planu
// pierwotnego; w trakcie i zakończony mają plan pierwotny (brak = daty z karty); tylko zakończony ma datę zakończenia (brak = ostatni dzień).
function lifecycleInvariants(p) {
  if (p.status === 'planned') return { ...p, startedAt: null, doneAt: null, baselineStart: null, baselineEnd: null };
  return { ...p,
    doneAt: p.status === 'done' ? (p.doneAt || TERM.lastDay(p.end)) : null,
    baselineStart: p.baselineStart || (p.start ? new Date(p.start) : null),
    baselineEnd: p.baselineEnd || (p.end ? new Date(p.end) : null) };
}
function saveCard(prev, data, today, { id, rebaseline = false } = {}) {
  const copy = d => d ? new Date(d) : null;
  const own = prev && {   // głęboka kopia poprzedniego: nowy obiekt niczego z nim nie dzieli
    ...prev, editors: [...prev.editors], assignments: prev.assignments.map(a => ({ ...a })), mf: { ...prev.mf },
    milestones: prev.milestones.map(m => ({ ...m, date: copy(m.date), doneAt: copy(m.doneAt) })), history: prev.history.map(h => ({ ...h })),
    startedAt: copy(prev.startedAt), doneAt: copy(prev.doneAt), baselineStart: copy(prev.baselineStart), baselineEnd: copy(prev.baselineEnd) };
  const p = own ? { ...own, ...data } : { id, ...data, baselineStart: null, baselineEnd: null, startedAt: null, doneAt: null, history: [] };
  const wasCommitted = !!prev && prev.status !== 'planned';
  if (p.status !== (prev ? prev.status : null)) {
    p.history.push({ date: toLocalISO(today), status: p.status });
    if (p.status === 'ongoing' && !p.startedAt) p.startedAt = new Date(today);
    if (p.status === 'done') { if (!p.startedAt) p.startedAt = new Date(p.start); p.doneAt = new Date(today); }
    if (p.status !== 'done') p.doneAt = null;
    if (p.status === 'planned') p.startedAt = null;
  }
  if (p.status === 'planned') { p.baselineStart = null; p.baselineEnd = null; }
  else if (!wasCommitted || !p.baselineStart || rebaseline) { p.baselineStart = new Date(p.start); p.baselineEnd = new Date(p.end); }
  return lifecycleInvariants(p);
}
// STAN PROJEKTU W OKRESIE (CONTEXT.md: W trakcie, Projekty w toku, Limit WIP). Jedyne miejsce, które odpowiada na pytanie
// „czy projekt był / będzie w trakcie w tym okresie”. Korzystają: obciążenie i decyzje (portfel), „W trakcie dziś”, Obeya A3, Miary.
// W trakcie = od zobowiązania do faktycznego zakończenia; projekt w trakcie po terminie z karty zostaje w trakcie (także w przyszłości).
// Planowany nigdy nie jest w trakcie (nie obciąża ludzi), ale ma swój termin z karty (plannedIn).
function ongoingSpan(p, today) {
  if (p.status === 'planned' || !hasDates(p)) return null;
  return [p.startedAt || p.start, p.status === 'done' ? actualEnd(p) : (p.end > today ? p.end : Infinity)];
}
const ongoingIn = (p, from, to, today) => { const s = ongoingSpan(p, today); return !!s && TERM.overlaps(s[0], s[1], from, to); };
// Planowany w okresie: termin z karty nachodzi na okres; planowany, któremu minęła data startu, zostaje planowanym od dziś w przód (jak w Miarach)
const plannedIn = (p, from, to, today) => p.status === 'planned' && hasDates(p) && (TERM.overlaps(p.start, p.end, from, to) || (p.start < today && to > today));
const projectsOngoingOn = (projects, day) => projects.filter(p => ongoingIn(p, day, TERM.endAfter(day), day));

const leadTime = p => (p.status === 'done' && p.startedAt && p.doneAt) ? TERM.days(p.startedAt, TERM.endAfter(p.doneAt)) : null;
// Jeden stan na okres (Miary): zakończony > w trakcie > planowany (na koniec okresu). Przeszłość i bieżący okres = faktyczny stan,
// przyszłość = termin z karty (termin, który już minął, nie zmienia stanu).
function stateInPeriod(p, from, to, today) {
  if (!hasDates(p)) return null;
  if (from > today) {
    if (p.status === 'done') return null;
    if (p.status === 'ongoing' && p.end <= today) return 'ongoing';
    if (p.status === 'planned' && p.start < today) return 'planned';
    const last = TERM.lastDay(p.end);
    if (TERM.contains(from, to, last)) return 'done';
    if (TERM.overlaps(p.start, p.end, from, to)) return 'ongoing';
    return p.status === 'planned' && p.start >= to ? 'planned' : null;
  }
  const cut = to > today ? TERM.endAfter(today) : to;   // bieżący okres liczy się do dziś
  if (p.doneAt && TERM.contains(from, cut, p.doneAt)) return 'done';
  if (p.doneAt && p.doneAt < from) return null;
  if (ongoingIn(p, from, cut, today)) return 'ongoing';
  const dates = p.history.map(h => fromLocalISO(h.date)).filter(Boolean);
  const created = dates.length ? new Date(Math.min(...dates)) : null;
  return (created ? created < cut : to > today) ? 'planned' : null;   // bez historii nie wiemy, od kiedy istnieje — liczymy tylko bieżący okres
}
const hasPlan = d => d && (Array.isArray(d.tabs) || Array.isArray(d.projects));

function applyData(data) {

  if (data && Number.isFinite(data.wipLimit)) AppState.wipLimit = data.wipLimit;

    ? data.tabs
    : [{ title: 'Portfolio', projects: data && Array.isArray(data.projects) ? data.projects : [] }];

const gasCall = (name, ...args) => new Promise((ok, fail) => GAS.withSuccessHandler(ok).withFailureHandler(fail)[name](...args));
const canSaveNow = () => loaded && Perm.canEditAny() && !Preview.as;
const session = GAS ? createPlanSession({

  readPlan: serialize,
  applyPlan: plan => { const tab = AppState.activeTab; quiet(() => applyData({ ...plan, activeTab: tab })); },

// Wołane po każdej zmianie (renderAll kończy się save()). Sesja sama pomija render bez zmian.
function save() {
  if (!canSaveNow()) return;
  saveLocal();
  if (!session) { statusEl.textContent = `Zapisano lokalnie ${hhmm()}`; return; }
  if (!session.available()) { statusEl.textContent = 'Arkusz niedostępny – zapis tylko lokalny'; return; }
  session.changed();
}
// Render bez wyzwalania zapisu
function quiet(fn) { const was = loaded; loaded = false; try { fn(); renderAll(); } finally { loaded = was; } }

function alarm(msg) {
  let el = document.getElementById('alarmPasek');
  if (!el) {
    el = document.createElement('div');
    el.id = 'alarmPasek';
    el.style.cssText = 'position:sticky;top:0;z-index:2000;background:var(--blad);color:#fff;padding:10px 16px;font-weight:600;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between';
    document.body.prepend(el);
  }
  el.innerHTML = `<span>${esc(msg)}</span><button class="btn btn-secondary btn-maly" onclick="location.reload()">Odśwież</button>`;
}

  if (!GAS) {
    const had = loadLocal();
    if (!had) applyData({ projects: [] });
    loaded = true; done();
    statusEl.textContent = 'Plik lokalny – dane tylko w tej przeglądarce';
    return;
  }
  statusEl.textContent = 'Wczytywanie z Arkusza…';
  session.load().then(res => {
        Perm.identify(res.user, res.isOwner);
        AppState.serverParts = res.parts || {};
        // Arkusz rządzi: pusty Arkusz = pusty plan (bez dociągania localStorage)
        applyData(hasPlan(res.data) ? res.data : { projects: [] });
        applyPerm();
        showWho();
        loaded = true;
        if (res.isOwner) statusEl.textContent = `Wczytano ${hhmm()}`;
        done();
      }, err => {
        // Bez Arkusza nie pokazujemy kopii z przeglądarki i blokujemy edycję — inaczej zmiany przepadają po cichu
        console.error(err);
        Perm.goOffline();
        applyData({ projects: [] });
        applyPerm();
        statusEl.textContent = 'Brak połączenia z Arkuszem';
        alarm(`Nie mogę wczytać planu z Arkusza (${err && err.message || err}). Edycja jest zablokowana, nic się nie zapisze. Odśwież stronę; jeśli to się powtarza, przyślij ten komunikat.`);
        done();
      });
}
